# §12.3：ruff（lint+format）、detect-secrets（密钥扫描）、prettier（前端）
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/
        types_or: [javascript, jsx, ts, tsx, json, css, yaml]
        args: ["--config", "web/.prettierrc.json"]
