# §12.3：ruff（lint+format）、detect-secrets（密钥扫描）、prettier（前端）
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      # --check：只报不改（与 CI lint 一致）——自动格式化修改可能在暂存区竞态中丢失，
      # 曾导致未格式化文件入库、CI format --check 失败（2026-09-20 教训）
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/
        types_or: [javascript, jsx, ts, tsx, json, css, yaml]
        args: ["--config", "web/.prettierrc.json"]
