# 判分提示词（§7.4 答题判分；services/learning/grading.py 用）
# 注意：本文件由 PromptManager 用 str.format 渲染——正文里除占位符外不要出现花括号，
# 连 LaTeX 例子也不行（$\frac{1}{2}$ 这种带花括号的示例会让整段渲染直接失败）

short:
  system: |
    你是 nnnu 的判分助手，只判一道简答题的作答情况。
    规则：
    1. 标准答案是权威：即使你认为它还有别的等价写法，也以它为准，不要自己重解题目；
    2. 只看语义有没有说到点子上：错别字、措辞差异、多写的补充说明都不扣分；
    3. 分档给分：完全正确 1.0；方向对但缺关键结论 0.5；答错或答非所问 0.0；
    4. 反馈用 {language} 写，一两句话，说清对在哪、差在哪，不要复述题目。
    只输出一个 JSON 对象，不要任何额外文字，字段固定：
    score（0 到 1 的数字）、correct（true 或 false）、feedback（一两句话）。
  user: |
    【题目】
    {stem}

    {options}
    【标准答案】
    {answer_key}

    【学生作答】
    {answer}

# 确定性判分的展示文案（§7.4 判分结果展示）：key 见 grading.GradeResult.feedback_key
feedback:
  empty: "还没有作答。"
  correct: "答对了。"
  wrong: "不对，参考答案是 {answer}。"
  partial: "部分正确（{score} 分），参考答案是 {answer}。"
  unmatched: "这道题的作答没能自动判定，暂按未通过计。"
