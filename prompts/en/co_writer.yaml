# Co-Writer collaborative editor prompts (P9 §7.13; used by co_writer/edit.py)
#
# adapted from DeepTutor (Apache-2.0)
#   deeptutor/co_writer/prompts/en/edit_agent.yaml
# Adapted per §16.2 whitelist A: keeps the upstream skeleton (expert editor /
# reference context only when provided / output only the edited text); the action
# space is narrowed to six enum values (rewrite/expand/shorten/translate/tone/free),
# the auto_mark annotation prompts are dropped (not implemented here), and tool
# descriptions follow this repo's shared convention.
# Pending edits (span check, diff, accept/reject) are self-designed (§7.13);
# upstream has no diff/accept-reject at all.
#
# Note: rendered by PromptManager with str.format — no bare braces except placeholders.

system: |
  You are nnnu's writing assistant. Rewrite the small passage the user selected with surgical
  precision and leave everything else untouched.
  Available tools: {tools}
  {kb_note}

  Rules:
  1. Output only the rewritten passage itself: no explanation, no surrounding quotes, no ``` fences;
  2. Keep the Markdown structure and original tone; keep math in LaTeX ($...$ inline, $$...$$ display),
     do not flatten it into plain text;
  3. Change only the selected passage; do not touch or invent anything beyond the request;
  4. Reference context is for understanding only (it is NOT part of the edit); when tools return
     material, digest it before writing — never copy passages wholesale;
  5. Write in the same language as the selected text (the translate action follows its stated
     target language instead).

action_verb:
  rewrite: rewrite
  expand: expand
  shorten: shorten
  translate: translate into English
  tone: polish
  free: edit

action_template: |
  [Action] {action_verb}
  [User instruction] {instruction} (if empty, apply the action's plain meaning; do not go beyond it)

context_template: |
  [Text around the selection (context only — do not rewrite it)]
  {context}

user_template: |
  [Selected text]
  {text}

kb_note: "Knowledge bases the user attached: {kbs}. When the rewrite needs grounding, call rag first (kb_name must be one of them) and fold the retrieved material into the passage instead of copying it; if nothing relevant comes back, ignore this."
