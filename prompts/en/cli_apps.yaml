# CLI app prompts (§7.18): output strings for list_cli_apps / run_cli_app plus the
# first-run guide. Mind the str.format brace trap: literal braces must be doubled.
guide_header: "[App usage guide] {app}"
guide_seen: "(The usage guide for {app} was already given once in this session; see list_cli_apps for the parameter template.)"
not_installed: "\"{app}\" is not installed yet (program {program} not found). Ask the user to install it from the CLI apps page in settings instead of trying to install it yourself."
bad_args: "Nothing ran: {error} (see list_cli_apps for the parameter template)"
run_failed: "(The run did not finish cleanly: {error})"
output_truncated: "(Output truncated; ask the user to open the file in the workspace if the full result is needed.)"
installed_header: "Installed apps:"
search_header: "Catalog entries matching \"{query}\":"
search_empty: "No catalog entry matches \"{query}\"."
no_apps: "No command-line app is installed yet. The user can install some (ffmpeg, pandoc, p7zip, ...) from the CLI apps page in settings."
app_line: "- {name} (id={app}, {status}): {description}"
installed_badge: "installed"
available_badge: "not installed"
params_header: "Parameters:"
param_line: "- {name} ({note}): {description}"
param_required: "required"
param_optional: "optional"
list_hint: "Run one with run_cli_app: app is the id, args follow the parameters above. All paths are relative to the sandbox working directory (data/user/workspace)."
app_not_found: "There is no app named \"{app}\". Currently installed: {apps}. Use list_cli_apps for the full list."
