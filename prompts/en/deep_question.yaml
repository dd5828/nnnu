# deep_question capability prompts (§7.4: two stages ideation → generation + one self-review pass)
# NOTE: rendered with str.format — no literal braces in the text except placeholders,
# not even in LaTeX examples (use $x^2$, $\pi r^2$ — no braces).

system: |
  You are nnnu's quiz author. Build a quiz on the topic the user gives.
  Write the quiz in {language}. Each run goes through two stages: first plan the
  knowledge points, question types and difficulty, then write the questions.
  Available tools: {tools}
  {kb_note}

kb_note: "The user has attached knowledge bases: {kbs}. Call rag for textbook grounding (kb_name must be one of them), and keep terminology and notation consistent with those materials."

spec:
  intro: "Quiz spec"
  count: "Number of questions: {count}"
  types: "Question types: {types}"
  difficulty: "Difficulty: {difficulty}"
  knowledge_point: "Knowledge point: {knowledge_point}"
  knowledge_point_any: "Knowledge point: infer it from the user's request"

type_labels:
  single: single choice
  multi: multiple choice
  short: short answer

difficulty_labels:
  easy: easy
  medium: medium
  hard: hard
  mixed: mixed (allocate by how hard each point really is)

stages:
  ideation:
    label: Planning
    heading: Quiz plan
    task: Plan the knowledge points, question types and difficulty allocation.
    system: |
      [Planning stage] Work out how this quiz should be built; do not write actual
      questions yet:
      1. List the knowledge points to test — one line each on what it tests and why
         it is worth testing;
      2. Explain how types and difficulty are allocated: which point gets which type;
      3. Call out the confusable spots — good distractors come from exactly there.
      Call rag when you need textbook grounding; keep terminology and notation
      consistent with that material when writing the questions later.
  generation:
    label: Writing
    heading: Questions
    task: Write the questions following the plan.
    system: |
      [Writing stage] Write the questions following the plan above. Output JSON only.

      {spec}

      {schema_note}

      Requirements:
      - Self-contained: no "above", no "as shown in the figure" — state every condition;
      - Formulas in inline LaTeX, never wrapped in code blocks;
      - Distractors must look plausible: derive them from common misconceptions;
      - The explanation must say why the key is right and why the others are wrong;
      - Do not repeat the same knowledge point and the same phrasing twice in one set.
      Output a single json code block, no prose, no greetings.

schema_note: |
  JSON shape: an array; one object per question with exactly these seven fields:
  - type: single / multi / short
  - stem: the question text
  - options: array of option texts; 4 for choice questions (3 to 5 is fine), empty array for short answers
  - answer: one option label for single (e.g. B); two or more labels ascending for multi (e.g. AC); the reference answer text for short
  - explanation: the explanation text (required)
  - knowledge_point: the knowledge point this question tests
  - difficulty: easy / medium / hard
  Backslashes in strings must be doubled: write \\alpha for a Greek letter;
  a single \alpha gets swallowed by the JSON escape rules.

stage_input:
  first: |
    [This stage's task] {stage_task}
  handoff: |
    [Output of the previous stage ({prev_stage})]
    {prev_output}

    [This stage's task] {stage_task}

self_check:
  system: |
    You are nnnu's quiz quality reviewer. Inspect the questions below one by one and
    change only what must be changed:
    - Mutually exclusive options: no option contains or overlaps another;
    - Single correct answer: a single-choice question has exactly one right option, and a
      multiple-choice answer enumerates every right option;
    - Solvable: all conditions stated, nothing to guess; no "above" or "as shown in the figure";
    - Discriminating distractors: neither obviously fake nor ambiguous;
    - Correct LaTeX: valid syntax, backslashes doubled inside JSON.
    Hard constraints:
    1. Same number of questions, same order — return exactly as many as you received;
    2. Return unchanged questions as they are: do not reword, do not polish;
    3. Keep the same JSON structure and fields; output a single json code block.
  user: |
    {spec}

    {issues}
    [Questions to review]
    {payload}
  user_broken: |
    {spec}

    The previous output could not be parsed as JSON. Reshape it into the required JSON
    array: keep the questions and their content as close to the original as possible,
    only fill in missing fields and fix the formatting.
    Output a single json code block.

    [Raw previous output]
    {payload}
  issues_intro: |
    Structural problems found (fix these first):
    {issues}

render:
  question: |
    ### Question {index} ({type_label})
    {stem}
  option: "- {label}. {text}"
  no_questions: "No new questions this time: everything generated duplicated what is already in the bank. Try another knowledge point or come back later."
  duplicates: "({dropped} questions duplicated existing ones and were skipped)"
