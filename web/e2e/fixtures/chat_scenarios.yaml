# P2 #9 E2E 脚本（§14 验收②离线预演）：一个会话串行跑完 7.1 全部验收场景。
# 步骤按 LLM 调用序消费（ScriptedLLM）；每回合=一条用户消息（重新生成复用原消息）。
steps:
  # Turn 1（测试①）：流式一问一答——思考块 + KaTeX 公式 + 成本
  - thinking: ["用户想了解傅里叶变换，先梳理核心概念"]
    delay_ms: 1500
    chunks:
      - "傅里叶变换把时域信号分解为频域分量。"
      - "对照一个公式：$E=mc^2$。"
    finish_reason: stop
    usage: { prompt_tokens: 120, completion_tokens: 80 }
  # Turn 2（测试②）：模型调 ask_user → 用户选「工程应用」→ 最终回答
  - tool_calls:
      - {
          id: ask-1,
          name: ask_user,
          arguments: '{"question": "你想深入了解哪个方向？", "options": ["数学推导", "工程应用"]}',
        }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["好，我们看工程应用方向：傅里叶变换广泛用于信号滤波和图像压缩。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 3（测试③）：重新生成——同一条用户消息重跑出新答案
  - chunks: ["重新生成的回答：傅里叶变换把时域信号分解为频域分量。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 4（测试④）：停止——8s 停顿留出停表窗口，用户在完成前点停止
  - thinking: ["这个问题需要仔细推导"]
    delay_ms: 8000
    chunks: ["这是一段会被中途停止的回答。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 5（测试⑤）：附件检索引用——模型先调 attachment_search 再带引用回答
  - tool_calls:
      - { id: att-1, name: attachment_search, arguments: '{"query": "傅里叶变换"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["根据你上传的文档，傅里叶变换把时域信号分解为频域分量（见引用）。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 6（测试⑥）：code_execution——模型写代码，沙箱真跑（stdout 用 ASCII，避开子进程编码）
  - tool_calls:
      - {
          id: code-1,
          name: code_execution,
          arguments: '{"code": "print(\"sum-1-to-10=\", sum(range(1, 11)))"}',
        }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["沙箱算出来是 55。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 7（测试⑦）：工具开关——设置里把 exec 放行后，模型调 exec 真能跑命令
  - tool_calls:
      - { id: exec-1, name: exec, arguments: '{"command": "echo exec-ok"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["命令跑通了，输出 exec-ok。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 8（测试⑨）：知识库检索——测试⑧ 已建好「信号库」，⑨ 里用户先选中它，
  # rag 才挂载（§7.9：不选库不检索）；kb_name 必须点名用户挂的库
  - tool_calls:
      - { id: rag-1, name: rag, arguments: '{"query": "傅里叶变换", "kb_name": "信号库"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["知识库里说，傅里叶变换把时域信号分解为频域分量（见引用）。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 9（测试⑪）：模型选择——新会话里选中 deepseek-chat 后随便发一条（粘性靠回合落库）
  - chunks: ["模型选择验证回答。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 12（测试⑭）：聊天里建学习路径——先 mastery_paths 看库里有没有现成的（本会话还没绑路径），
  # 没有才 mastery_build（路径只能这么建：没有 POST /learning/paths）。第一个节点刻意是「记忆」
  # （定量门 90、还没碰过）→ 服务端现算的下一目标是 probe（摸底）
  - tool_calls:
      - { id: master-1, name: mastery_paths, arguments: "{}" }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - tool_calls:
      - id: master-2
        name: mastery_build
        arguments: '{"topic": "线性代数基础", "title": "线性代数基础", "summary": "从向量到矩阵", "nodes": [{"title": "向量与线性组合", "type": "memory", "description": "线性组合的定义与运算"}, {"title": "矩阵与行列式", "type": "procedure", "parent_index": 0}]}'
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["学习路径《线性代数基础》建好了，我们从「向量与线性组合」开始。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 13（测试⑭）：看板点「去聊天里学」只备会话（零 LLM），**用户自己打一句**才跑这一轮。
  # 出题权归模型后一次答题是**三段**：mastery_quiz 登记（答案留服务端）
  # → 模型自己调 ask_user 发卡（**卡片阻塞不占 LLM 调用**）→ mastery_grade 判分。同一轮里的
  # 工具是**顺序执行**的，所以「判上一题 + 登记并发出下一题」能挤在同一轮。两道都对 →
  # 掌握度 80（两次作答封顶），还没过 90 的门 → 服务端下一目标仍是这个节点的 practice
  - chunks: ["先摸底：这两道做做看，对了就直接跳过讲解。"]
    tool_calls:
      - { id: master-3, name: mastery_status, arguments: "{}" }
      - id: master-4
        name: mastery_quiz
        arguments: '{"question": "向量和练习：a=(1,2) 与 b=(3,4) 的和是哪个？", "question_type": "single", "options": ["(3,8)", "(4,6)", "(1,2)", "(2,3)"], "expected_answer": "B", "explanation": "对应分量相加：(1+3, 2+4) = (4,6)。", "difficulty": "easy"}'
      - id: master-5
        name: ask_user
        arguments: '{"question": "向量和练习：a=(1,2) 与 b=(3,4) 的和是哪个？", "options": [{"label": "A", "description": "(3,8)"}, {"label": "B", "description": "(4,6)"}, {"label": "C", "description": "(1,2)"}, {"label": "D", "description": "(2,3)"}], "context": "节点《向量与线性组合》"}'
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - tool_calls:
      - { id: master-6, name: mastery_grade, arguments: "{}" }
      - id: master-7
        name: mastery_quiz
        arguments: '{"question": "数乘练习：向量 (2,4) 乘标量 3 得到什么？", "question_type": "single", "options": ["(5,7)", "(2,4)", "(6,12)", "(6,4)"], "expected_answer": "C", "explanation": "每个分量都乘以 3：(2×3, 4×3) = (6,12)。", "difficulty": "medium"}'
      - id: master-8
        name: ask_user
        arguments: '{"question": "数乘练习：向量 (2,4) 乘标量 3 得到什么？", "options": [{"label": "A", "description": "(5,7)"}, {"label": "B", "description": "(2,4)"}, {"label": "C", "description": "(6,12)"}, {"label": "D", "description": "(6,4)"}], "context": "节点《向量与线性组合》"}'
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - tool_calls:
      - { id: master-9, name: mastery_grade, arguments: "{}" }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["两题都对，掌握度到 80 了——再做一遍过 90 的门（两次作答封顶八十）。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 14（测试⑮）：deep_research 第一回合，quick 档 = 2 个子问题。澄清段（静默）先把主题
  # 打磨一遍；分解段（静默）吐 JSON 大纲——两段的正文都不进聊天，用户只看得到大纲。
  # 每步 1.5s 停顿留出步骤条「当前阶段」的观察窗
  - chunks:
      - "2025 年公开的 RAG 工程方案，面向要选型的开发者：范围限定在检索端与生成端的主流做法，核心问题是主流路线有哪些、各自的代价与适用场景是什么。"
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - |
        ```json
        {"sub_topics": [
          {"title": "主流技术路线", "overview": "朴素 RAG、进阶 RAG 与模块化 RAG 的分野与代表工作"},
          {"title": "评测与落地现状", "overview": "公开评测基准，以及真实部署里最常见的失败模式"}
        ]}
        ```
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 15（测试⑮）：用户点确认 → 第二回合。研究段**不调检索工具**（E2E 没有网络与密钥，
  # 真发请求会让调用数漂移）；报告段一次成稿，正文里自带 5 条 https 链接（渲染成新窗口可点）
  - chunks:
      - "这一条线的主流做法是把检索质量当第一性问题：查询改写、混合检索与重排三件套已成基线，向量库本身不再是差异点。"
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - "评测端以无参考指标为主，落地端最常翻车的地方是「检索到了但没用上」和「引用了不存在的来源」，两者都要靠重排与引用校验兜。"
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - |
        2025 年的 RAG 已经不只是「检索 + 拼接」：主流做法在朴素 RAG 之外叠加查询改写、混合检索与重排，并逐步把各环节拆成可替换模块。

        ## 三条主流技术路线

        - **朴素 RAG**：向量检索加拼接上下文，仍是多数产品的基线（[Lewis 等，2020](https://arxiv.org/abs/2005.11401)）。
        - **进阶 RAG**：检索前后加查询改写与重排，检索质量的提升最直接（[Gao 等，2023](https://arxiv.org/abs/2312.10997)）。
        - **模块化 RAG**：索引、检索、生成拆成可组合模块，按任务动态路由（[模块化 RAG 综述](https://arxiv.org/abs/2407.21059)）。

        ## 评测与常见失败

        无参考指标已成事实标准（[RAGAS](https://arxiv.org/abs/2309.15217)）；工程上最常见的翻车是「检索到了但没用上」和「引用了不存在的来源」。

        ## 落地建议

        先把检索召回量化，再谈生成质量：重排与引用校验应当作必选项（[实践综述](https://arxiv.org/abs/2410.12837)）。
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 200 }
  # Turn 16（测试⑱）：deep_research 标准档，脚本给 3 个子问题 → 成稿走多段路：
  # 澄清 + 分解（大纲）→ 3 个子问题各一次摘要 → 引言 + 3 节 + 结论，共 10 步。
  # 节标题与编号由代码按大纲给（`## k. 标题`），所以各节的正文块里**故意一个字标题都不写**；
  # 引言与各节的 delay_ms 留出观察窗：第 1 节出现时第 3 节还没影（写一段发一段）
  - chunks:
      - "2025 年向量数据库选型，面向自托管场景的开发者：范围限定在主流产品、性能与成本、迁移与运维三块，核心问题是怎么选、各自的代价是什么。"
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - |
        ```json
        {"sub_topics": [
          {"title": "主流产品对比", "overview": "Milvus、Qdrant、pgvector 等代表产品的定位"},
          {"title": "性能与成本", "overview": "召回质量、延迟与自托管成本"},
          {"title": "迁移与运维", "overview": "从现有方案迁移与日常运维的坑"}
        ]}
        ```
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["主流产品各有取舍：专用向量库在规模上占优，数据库插件胜在运维面小。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["性能上召回质量与延迟强相关，自托管的成本大头在内存。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["迁移的坑集中在索引重建与数据一致性，运维要把备份演练做足。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["选型没有唯一答案：小规模用数据库插件省事，规模上来再换专用库。"]
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["这一节展开产品对比：Milvus 偏大规模，Qdrant 轻量好上手，pgvector 与现有数据库同源。"]
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["这一节看性能与成本：内存是主要开销，召回质量与延迟要一起量。"]
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["这一节说迁移与运维：先做索引重建演练，再谈切换。"]
    finish_reason: stop
    delay_ms: 1500
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["综合来看：先按规模与运维能力划线，再在候选里比召回质量。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 17（测试⑲-1）：visualize 第一回合（SVG）。三阶段各吃一次 LLM 调用：分析段回 JSON 定类型、
  # 生成段回恰好一个渲染围栏、复查段回 JSON 判 ok。阶段原文都被 SilentBus 吞掉，正文是代码按契约拼的
  # （标题 + 一句说明 + 恰好一个围栏）；分析/生成段的 delay 留出阶段条的观察窗
  - chunks:
      - '{"render_type": "svg", "title": "Transformer 编码器结构", "description": "从输入嵌入到编码器输出：多头自注意力与逐位置前馈各带残差连接与层归一化。", "elements": ["输入嵌入 + 位置编码", "多头自注意力", "逐位置前馈网络", "编码器输出"], "rationale": "结构示意图要坐标级控制，SVG 最合适。"}'
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 60 }
  - chunks:
      - |
        ```svg
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 264">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" />
            </marker>
          </defs>
          <g class="c-gray">
            <rect class="box" x="120" y="16" width="240" height="36" rx="8" />
            <text class="t" x="240" y="34" text-anchor="middle">输入嵌入 + 位置编码</text>
          </g>
          <path class="arr" d="M240 52L240 74" marker-end="url(#arrow)" />
          <g class="c-blue">
            <rect class="box" x="120" y="76" width="240" height="40" rx="8" />
            <text class="t" x="240" y="96" text-anchor="middle">多头自注意力</text>
          </g>
          <path class="arr" d="M240 116L240 138" marker-end="url(#arrow)" />
          <g class="c-blue">
            <rect class="box" x="120" y="140" width="240" height="40" rx="8" />
            <text class="t" x="240" y="160" text-anchor="middle">逐位置前馈网络</text>
          </g>
          <path class="arr" d="M240 180L240 202" marker-end="url(#arrow)" />
          <g class="c-gray">
            <rect class="box" x="120" y="204" width="240" height="36" rx="8" />
            <text class="t" x="240" y="222" text-anchor="middle">编码器输出</text>
          </g>
        </svg>
        ```
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 220 }
  - chunks:
      - '{"verdict": "ok", "code": "", "notes": "四层结构完整、箭头闭合，与简报一致。"}'
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 40 }
  # Turn 18（测试⑲-2）：visualize 第二回合（ECharts）。生成段回严格 JSON 的 option——
  # 顶层要有非空的 series，不然确定性校验器会让它先修复、再降级
  - chunks:
      - '{"render_type": "echarts", "title": "正弦曲线", "description": "0 到 2π 上五个关键点的正弦折线，验证 ECharts 渲染链路。", "elements": ["x 轴按弧度标注", "y 轴 -1 到 1", "平滑折线"], "rationale": "定量曲线是图表的标准用例。"}'
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 60 }
  - chunks:
      - |
        ```echarts
        {"title": {"text": "y = sin(x)", "left": "center"}, "xAxis": {"type": "category", "data": ["0", "π/2", "π", "3π/2", "2π"]}, "yAxis": {"type": "value", "min": -1, "max": 1}, "series": [{"name": "sin(x)", "type": "line", "smooth": true, "data": [0, 1, 0, -1, 0]}]}
        ```
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 200 }
  - chunks:
      - '{"verdict": "ok", "code": "", "notes": "选项是合法 JSON，坐标轴与数据对得上。"}'
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 40 }
  # Turn 19（测试⑲-3）：visualize 第三回合（Mermaid）。首行必须是图类型关键字
  - chunks:
      - '{"render_type": "mermaid", "title": "冒泡排序流程", "description": "一轮扫描的比较与交换分支，交换后再进下一对，扫完从头再来。", "elements": ["开始与结束", "比较相邻元素", "交换分支", "下一对循环"], "rationale": "带分支的流程用流程图最直观。"}'
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 60 }
  - chunks:
      - |
        ```mermaid
        flowchart TD
          A[开始冒泡排序] --> B[比较相邻两个元素]
          B --> C{前一个更大吗}
          C -- 是 --> D[交换两个元素]
          C -- 否 --> E[保持原位]
          D --> F{还有下一对吗}
          E --> F
          F -- 是 --> B
          F -- 否 --> G[结束本轮扫描]
        ```
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 200 }
  - chunks:
      - '{"verdict": "ok", "code": "", "notes": "分支闭合，交换后有回路，读得通。"}'
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 40 }
  # Turn 20（测试⑲-4）：visualize 第四回合（HTML）。沙箱 iframe 里真跑：拖动滑杆改半径与面积；
  # 页面里的 Math.PI 与 innerHTML 更新是给「交互型」验收用的（E2E 只断言 iframe 落地与 srcdoc）
  - chunks:
      - '{"render_type": "html", "title": "圆的半径与面积", "description": "一个滑杆拖动半径，圆实时缩放并显示半径与面积数值。", "elements": ["半径滑杆", "实时缩放的圆", "半径与面积读数"], "rationale": "要用户操作并看到状态变化，单文件 HTML 最合适。"}'
    finish_reason: stop
    delay_ms: 900
    usage: { prompt_tokens: 100, completion_tokens: 60 }
  - chunks:
      - |
        ```html
        <!DOCTYPE html>
        <html lang="zh">
