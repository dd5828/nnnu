# P2 #9 E2E 脚本（§14 验收②离线预演）：一个会话串行跑完 7.1 全部验收场景。
# 步骤按 LLM 调用序消费（ScriptedLLM）；每回合=一条用户消息（重新生成复用原消息）。
steps:
  # Turn 1（测试①）：流式一问一答——思考块 + KaTeX 公式 + 成本
  - thinking: ["用户想了解傅里叶变换，先梳理核心概念"]
    delay_ms: 1500
    chunks:
      - "傅里叶变换把时域信号分解为频域分量。"
      - "对照一个公式：$E=mc^2$。"
    finish_reason: stop
    usage: { prompt_tokens: 120, completion_tokens: 80 }
  # Turn 2（测试②）：模型调 ask_user → 用户选「工程应用」→ 最终回答
  - tool_calls:
      - {
          id: ask-1,
          name: ask_user,
          arguments: '{"question": "你想深入了解哪个方向？", "options": ["数学推导", "工程应用"]}',
        }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["好，我们看工程应用方向：傅里叶变换广泛用于信号滤波和图像压缩。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 3（测试③）：重新生成——同一条用户消息重跑出新答案
  - chunks: ["重新生成的回答：傅里叶变换把时域信号分解为频域分量。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 4（测试④）：停止——8s 停顿留出停表窗口，用户在完成前点停止
  - thinking: ["这个问题需要仔细推导"]
    delay_ms: 8000
    chunks: ["这是一段会被中途停止的回答。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 5（测试⑤）：附件检索引用——模型先调 attachment_search 再带引用回答
  - tool_calls:
      - { id: att-1, name: attachment_search, arguments: '{"query": "傅里叶变换"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["根据你上传的文档，傅里叶变换把时域信号分解为频域分量（见引用）。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 6（测试⑥）：code_execution——模型写代码，沙箱真跑（stdout 用 ASCII，避开子进程编码）
  - tool_calls:
      - {
          id: code-1,
          name: code_execution,
          arguments: '{"code": "print(\"sum-1-to-10=\", sum(range(1, 11)))"}',
        }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["沙箱算出来是 55。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 7（测试⑦）：工具开关——设置里把 exec 放行后，模型调 exec 真能跑命令
  - tool_calls:
      - { id: exec-1, name: exec, arguments: '{"command": "echo exec-ok"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["命令跑通了，输出 exec-ok。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 8（测试⑨）：知识库检索——测试⑧ 已建好「信号库」，⑨ 里用户先选中它，
  # rag 才挂载（§7.9：不选库不检索）；kb_name 必须点名用户挂的库
  - tool_calls:
      - { id: rag-1, name: rag, arguments: '{"query": "傅里叶变换", "kb_name": "信号库"}' }
    finish_reason: tool_calls
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["知识库里说，傅里叶变换把时域信号分解为频域分量（见引用）。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 9（测试⑪）：模型选择——新会话里选中 deepseek-chat 后随便发一条（粘性靠回合落库）
  - chunks: ["模型选择验证回答。"]
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 10（测试⑫）：deep_solve 三阶段——每阶段一次 LLM 调用（一个回合 3 步），
  # delay_ms 留出步骤条「当前阶段」的观察窗（§7.3）
  - chunks: ["考点是链式法则与复合函数求导，思路：令 u=x²。"]
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks: ["逐步推导：d/dx[sin(u)]=cos(u)·2x，代回 u=x²。"]
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - "教学级解答：最终答案 2x·cos(x²)。"
      - "对照公式：$d/dx[\\sin(x^2)] = 2x\\cos(x^2)$。"
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 11（测试⑬）：deep_question 两阶段——构思流式 + 生成静默（正文是 JSON）+ 自评非流式，
  # 一个回合固定 3 次调用；JSON 用块标量写，`\\frac` 是 JSON 转义后的单反斜杠（LaTeX 原样留）
  - chunks:
      - "构思：链式法则的考点分三块——外层求导、内层求导、复合相乘；安排两道选择加一道简答。"
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  - chunks:
      - |
        ```json
        [
          {"type": "single", "stem": "链式法则练习 1：求 $f(x)=(2x+1)^3$ 的导数",
           "options": ["$6(2x+1)^2$", "$3(2x+1)^2$", "$2(2x+1)^3$", "$6(2x+1)^3$"], "answer": "B",
           "explanation": "外层 $u^3$ 求导得 $3u^2$，内层 $2x+1$ 求导得 2，相乘得 $6(2x+1)^2$。",
           "knowledge_point": "链式法则", "difficulty": "easy"},
          {"type": "single", "stem": "链式法则练习 2：求 $y=\\sin(3x)$ 的导数",
           "options": ["$3\\cos(3x)$", "$\\cos(3x)$", "$-3\\sin(3x)$", "$3\\sin(3x)$"], "answer": "A",
           "explanation": "外层 $\\sin u$ 求导得 $\\cos u$，内层 $3x$ 求导得 3，相乘即 $3\\cos(3x)$。",
           "knowledge_point": "链式法则", "difficulty": "medium"},
          {"type": "short", "stem": "链式法则练习 3：用自己的话说说什么时候该用链式法则。",
           "options": [], "answer": "遇到复合函数求导时用它：先对外层函数求导，再乘以内层函数的导数。",
           "explanation": "链式法则处理嵌套结构，逐层求导后相乘。",
           "knowledge_point": "链式法则", "difficulty": "hard"}
        ]
        ```
    finish_reason: stop
    delay_ms: 1200
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # 自评/修正轮（非流式）：题目不变，只把第 3 题的解析写细一点
  - chunks:
      - |
        ```json
        [
          {"type": "single", "stem": "链式法则练习 1：求 $f(x)=(2x+1)^3$ 的导数",
           "options": ["$6(2x+1)^2$", "$3(2x+1)^2$", "$2(2x+1)^3$", "$6(2x+1)^3$"], "answer": "B",
           "explanation": "外层 $u^3$ 求导得 $3u^2$，内层 $2x+1$ 求导得 2，相乘得 $6(2x+1)^2$。",
           "knowledge_point": "链式法则", "difficulty": "easy"},
          {"type": "single", "stem": "链式法则练习 2：求 $y=\\sin(3x)$ 的导数",
           "options": ["$3\\cos(3x)$", "$\\cos(3x)$", "$-3\\sin(3x)$", "$3\\sin(3x)$"], "answer": "A",
           "explanation": "外层 $\\sin u$ 求导得 $\\cos u$，内层 $3x$ 求导得 3，相乘即 $3\\cos(3x)$。",
           "knowledge_point": "链式法则", "difficulty": "medium"},
          {"type": "short", "stem": "链式法则练习 3：用自己的话说说什么时候该用链式法则。",
           "options": [], "answer": "遇到复合函数求导时用它：先对外层函数求导，再乘以内层函数的导数。",
           "explanation": "链式法则处理嵌套结构：把复合函数拆成外层与内层，逐层求导后相乘。",
           "knowledge_point": "链式法则", "difficulty": "hard"}
        ]
        ```
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
  # Turn 11 的收尾：题库页给简答题判分——确定性两条路都没命中，落到 LLM 判分器（非回合通路）
  - chunks:
      - '{"score": 0.0, "correct": false, "feedback": "参考答案说的是「复合函数求导时先外层再乘内层」，你的作答没有涉及这一点。"}'
    finish_reason: stop
    usage: { prompt_tokens: 100, completion_tokens: 30 }
