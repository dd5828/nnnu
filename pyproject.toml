[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nnnu"
dynamic = ["version"]
# 不设 readme 字段：全部 *.md 不入库，干净 checkout 下构建不能失败
description = "单用户 AI 学习工作台：agent-native 两层插件架构"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "httpx>=0.28",
    "PyYAML>=6.0.2",
    "psutil>=6.0,<8.0",
    "watchfiles>=0.24",  # dev.py 后端热重启循环（uvicorn[standard] 的传递依赖，显式声明）
    "aiosqlite>=0.20",  # §8.2 单文件 SQLite（会话/成本等持久化）
    "markitdown>=0.1.7",  # §4 文档解析默认引擎（P2 附件解析提前引入，P4 KB 复用）
    "PyMuPDF>=1.28",  # §4 PDF 解析与页级引用（P2 附件页码定位）
    "python-multipart>=0.0.12",  # 附件上传 multipart 表单（FastAPI 依赖）
    "numpy>=1.26",  # §7.9 知识库向量索引与余弦检索
]

[project.optional-dependencies]
# 链式分组（参考仓库 extras 组织方式）：核心依赖即默认安装，
# server 为空别名占位（对齐未来 CLI-only 拆分），重依赖随对应阶段填充。
server = []
rag = ["onnxruntime>=1.18"]  # §7.9 本地 ONNX 嵌入；不装则只能用远程嵌入端点
math-animator = []
partners = ["nnnu[server]"]
dev = [
    "nnnu[server]",
    "pytest>=8.3",
    "pytest-asyncio>=0.25,<2",
    "ruff==0.16.0",
    "mypy==2.3.1",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
]
all = ["nnnu[partners]", "nnnu[rag]", "nnnu[math-animator]", "nnnu[dev]"]

[tool.setuptools.dynamic]
version = { attr = "nnnu.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = ["B006"]
# RUF001-003：中文注释与文档中的全角标点是有意为之
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["E501", "F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["nnnu"]

[tool.mypy]
# 视角取 3.12：传递依赖（markitdown→magika→numpy）的 stub 使用 3.12+ 语法；
# 运行时兼容下限仍是 3.11（requires-python），本项目自身代码不用 3.12 新语法
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
